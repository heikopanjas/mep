[package]
name = "mep-clip"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clipboard-rs = { version = "0.3.5", default-features = false }

# Linux desktops run Wayland or X11; clipboard-rs picks Wayland when WAYLAND_DISPLAY is set.
[target.'cfg(target_os = "linux")'.dependencies]
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }

[dependencies.mep-core]
path = "../mep-core"
