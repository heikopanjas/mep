[m mep]

;load quickhelp module (see [mep-mhelp] section below)
;load:mhelp.dll

;numeric switches
entab:0
hike:1
hscroll:20
noise:50
rmargin:72
tabdisp:32
tabstops:4
; tabinsert: makes Tab insert spaces at the cursor, Shift+Tab remove leading blanks
tabinsert:
; usetabs: file tabs are tabstops wide, leading blanks of edited lines are saved as tabs
nousetabs:
tmpsav:40
traildisp:0
undocount:10
vscroll:1
; cursorsize:0 is underline, cursorsize:1 is block cursor
cursorsize:1
;
; Color code table
; ----------------
;
;    First digit    Second digit
;    (background)   (foreground)
;    ------------   ------------
; 0  Black          Black
; 1  Blue           Blue
; 2  Green          Green
; 3  Cyan           Cyan
; 4  Red            Red
; 5  Magenta        Magenta
; 6  Brown          Brown
; 7  Gray           Gray
; 8  Flash Black    Dark Gray
; 9  Flash Blue     Light Blue
; A  Flash Green    Light Green
; B  Flash Cyan     Light Cyan
; C  Flash Red      Light Red
; D  Flash Magenta  Light Magenta
; E  Flash Brown    Light Yellow
; F  Flash Gray     White
;
; Text color, default white on black
fgcolor:0F
; Status line color, default cyan on black
stacolor:03
; Information message color, default yellow on black
infcolor:0E
; Error message color, default red on black
errcolor:04

;boolean switches -- precede with "no" to deactivate
noaskexit:
askrtn:
autosave:
nocase:
displaycursor:
enterinsmode:
savescreen:
noshortnames:
softcr:
notrailspace:
nowordwrap:

;text switches
backup:bak
;markfile:
readonly:attrib -r

;macros and their key bindings
FirstColumn:=meta Begline
FirstColumn:Home
Selectdown:=Argcol Down
Selectdown:Shift+Down
Selectup:=Argcol Up
Selectup:Shift+Up
Selectleft:=Arg Left
Selectleft:Shift+Left
Selectright:=Arg Right
Selectright:Shift+Right
Selectmword:=Argcol Mword
Selectmword:Shift+Ctrl+Left
Selectpword:=Argcol Pword
Selectpword:Shift+Ctrl+Right

;key bindings
Arg:Alt+A
Assign:Alt+=
Backtab:Shift+Tab
Begfile:Ctrl+PgUp
;Begline:none
Cancel:Esc
Cdelete:Ctrl+G
Compile:Shift+F3
Copy:Ctrl+Ins
Copy:Ctrl+C
Down:Down
Emacscdel:Bksp
Emacsnewl:Enter
Endfile:Ctrl+PgDn
Endline:End
Execute:F7
Execute:Alt+E
Exit:Alt+X
Exit:F8
Home:Ctrl+Home
Information:Shift+F1
Initialize:Alt+F10
Insertmode:Ins
Lasttext:Ctrl+O
Lasttext:Alt+L
Ldelete:Ctrl+X
Left:Left
Linsert:Ctrl+N
Mark:Alt+M
Meta:F9
Mlines:Ctrl+W
Mpage:Pgup
Mpage:Ctrl+R
Mpara:Ctrl+Up
MetaMpara:=meta Mpara
MetaMpara:Ctrl+Home
Msearch:F4
Mword:Ctrl+Left
Paste:Shift+Ins
Paste:Ctrl+V
Pbal:Ctrl+[
Pbal:Alt+P
Ppage:Pgdn
Ppara:Ctrl+Down
MetaPpara:=meta Ppara
MetaPpara:Ctrl+End
Psearch:F3
Pword:Ctrl+Right
Pword:Ctrl+F
Qreplace:Ctrl+\
Qreplace:Alt+F3
Quote:Ctrl+P
Quote:Alt+Q
Redo:Ctrl+Y
Refresh:Alt+R
Replace:Ctrl+L
Right:Right
Right:Ctrl+D
Sdelete:Del
Sdelete:Shift+Del
Setfile:F2
Setwindow:Ctrl+]
Shell:Shift+F9
Sinsert:Alt+Ins
Tab:Tab
Undo:Alt+Bksp
Undo:Ctrl+Z
Up:Up
Up:Ctrl+E
Window:F6

extmake:c gcc -fsyntax-only %s

[mep-mhelp]
helpfiles:mep.hlp
